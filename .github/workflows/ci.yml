name: CI

on:
  push:
    branches: [develop, main]
  # PRs into develop/main only. No paths filter: a required check that a PR never triggers blocks the merge.
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # Shared lint, test and iOS build: https://github.com/Haelix-Code/swift-ci
    # Tests use XMLDocument, which is macOS-only, so they run on macOS; iOS only gets a build.
    uses: Haelix-Code/swift-ci/.github/workflows/swift-package.yml@v1
    with:
      scheme: ForeFlightKML
